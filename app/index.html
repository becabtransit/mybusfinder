	<link rel="canonical" href="https://mybusfinder.fr">
	<script>
        // Made with ♥ by BecabDev in Cannes, France ⛱️🎬
		(function () {
			try {
				var p = new URLSearchParams(window.location.search);
				var q = p.get('network');
				if (q && /^[a-z0-9-]+$/i.test(q)) {
					localStorage.setItem('activeNetwork', q);
				}
			} catch (_) {}
			var net = localStorage.getItem('activeNetwork') || 'palmbus';
			window.__BOOT_NETWORK = net;
			document.write(
				'<link rel="apple-touch-icon" href="networks/' + net + '/src/logo.png">' +
				'<link rel="icon" type="image/png" href="networks/' + net + '/src/logo.png">'
			);
		})();
	</script>

<body>

<div id="bottom-sheet" class="bs bs-collapsed">

    <!-- The growing/shrinking visual surface. Has 0 height in
         collapsed mode so the original pill-shaped #menubtm
         shows through cleanly underneath. -->
    <div class="bs-sheet-pane" id="bs-sheet-pane">

    <div id="bs-handle-zone">
    <div class="bs-handle-bar"></div>
    <div style="display:flex; align-items:center; justify-content:space-between; padding: 6px 14px 8px;">
        <div>
        <div style="font-size:15px; font-weight:500; color:white;">My Bus Finder</div>
        <div id="bs-network-name" style="font-size:11px; opacity:0.6; color:white;">palmbus · My Bus Finder</div>
        </div>
        <div style="display:flex; gap:6px;">
        <button id="bs-settings-icon" class="bs-icon-btn" aria-label="Paramètres">
            <i class="ti ti-settings" aria-hidden="true"></i>
        </button>
        <button id="bs-switch-network" class="bs-icon-btn" aria-label="Changer de réseau">
            <i class="ti ti-arrows-exchange" aria-hidden="true"></i>
        </button>
        </div>
    </div>
    </div>

<div id="bs-content">
  <div class="bs-separator"></div>

  <!-- Stats réseau live -->
  <div class="bs-stats-row">
    <div class="bs-stat-chip" id="bs-stat-vehicles">
      <i class="ti ti-bus" aria-hidden="true"></i>
      <span id="bs-stat-vehicles-val">—</span>
      <span class="bs-stat-label" data-i18n="vehicles">véhicules</span>
    </div>
    <div class="bs-stat-chip" id="bs-stat-lines">
      <i class="ti ti-route" aria-hidden="true"></i>
      <span id="bs-stat-lines-val">—</span>
      <span class="bs-stat-label" data-i18n="lines">lignes</span>
    </div>
    <div class="bs-stat-chip" id="bs-stat-delay">
      <i class="ti ti-clock-exclamation" aria-hidden="true"></i>
      <span id="bs-stat-delay-val">—</span>
      <span class="bs-stat-label">ponctualité</span>
    </div>
  </div>

  <!-- Recherche rapide de ligne -->
  <div class="bs-search-row">
    <i class="ti ti-search bs-search-icon" aria-hidden="true"></i>
    <input
      id="bs-line-search"
      type="text"
      class="bs-search-input"
      placeholder="Ligne, destination, bus..."
      autocomplete="off"
      autocorrect="off"
      spellcheck="false"
    />
    <button id="bs-search-clear" class="bs-search-clear" aria-label="Effacer" style="display:none;">
      <i class="ti ti-x" aria-hidden="true"></i>
    </button>
  </div>

  <div id="bs-search-results" class="bs-search-results" style="display:none;"></div>

  <div class="bs-grid">
    <button id="bus" class="bs-tile ripple-container">
      <i class="ti ti-list" aria-hidden="true"></i>
      <span data-i18n="network">Réseau</span>
    </button>
    <button id="bs-locate-btn" class="bs-tile ripple-container">
      <i class="ti ti-current-location" aria-hidden="true"></i>
      <span data-i18n="locate">Me localiser</span>
    </button>
    <button id="clock-feat" class="bs-tile ripple-container">
      <i class="ti ti-clock" aria-hidden="true"></i>
      <span data-i18n="schedules">Horaires</span>
    </button>
    <button id="mbh" class="bs-tile ripple-container">
      <i class="ti ti-history" aria-hidden="true"></i>
      <span data-i18n="history">Historique</span>
    </button>
    <button id="actu" class="bs-tile ripple-container">
      <i class="ti ti-bell-ringing" aria-hidden="true"></i>
      <span data-i18n="alerts">Alertes</span>
    </button>
    <button id="bs-stats-tile" class="bs-tile ripple-container">
      <i class="ti ti-chart-bar" aria-hidden="true"></i>
      <span data-i18n="statistics">Statistiques</span>
    </button>
  </div>

  <div id="bs-last-vehicle" class="bs-last-vehicle" style="display:none;">
    <div class="bs-last-vehicle-label">
      <i class="ti ti-clock-rewind" aria-hidden="true"></i>
      Dernier consulté
    </div>
    <button id="bs-last-vehicle-btn" class="bs-last-vehicle-btn ripple-container">
      <span id="bs-last-vehicle-line" class="bs-last-line-badge"></span>
      <span id="bs-last-vehicle-info"></span>
      <i class="ti ti-chevron-right" aria-hidden="true"></i>
    </button>
  </div>

</div>

<!-- Original menubottom — restored to its pre-refactor look:
     standalone fixed pill, original 4 buttons with their
     original onclick handlers. -->
<div class="menubottom">
    <ul id="menubtm" class="menubottom-ul ripple-container">
        <li>
            <a onclick="afficherMenu()"><span class="icon"><img src="src/menu.png" id="menuicon" style="width: 30px; height: 30px;"></img></span> <span
                class="title" data-i18n="menu">Menu</span></a>
        </li>
        <li>
            <a onclick="showUpdatePopup('schedule.html')" id="clock"><span class="icon"><img src="src/horloge.png" id="myscheduleicon" style="width: 30px; height: 30px;"></img></span> <span
                    class="title" data-i18n="schedule">Horaires</span></a>
        </li>
        <li>
            <a id="menubutton"><span class="icon"><img src="src/bus.png" id="vehicleicon" style="width: 30px; height: 30px;"></img></span> <span
                    class="title" data-i18n="network">Réseau</span></a>
        </li>
        <li>
            <a onclick="showUpdatePopup('alerts.html');" id="histovecbutton"><span class="icon"><img id="actuicon" src="src/newspaper.png" style="width: 30px; height: 30px;"></img></span> <span
                    class="title" data-i18n="news">Actualités</span></a>
        </li>
    </ul>
</div>

<div id="refresh-bouton-map" class="refresh-bouton ripple-container" onclick="main()">

</div>

<div id="locate-bouton-map" class="locate-bouton ripple-container" onclick="locateMe()">

<div id="loading-screen" class="logobkg">

<div id="network-switch-overlay" aria-hidden="true">
    <div class="ns-card">
        <div class="ns-progress"><span></span></div>
        <div class="ns-text">Changement de réseau…</div>
    </div>

<style>
    #network-switch-overlay {
        position: fixed; inset: 0; z-index: 99999;
        background: rgba(8,10,18,0.92);
        backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
        display: flex; align-items: center; justify-content: center;
        opacity: 0; pointer-events: none;
        transition: opacity 0.32s ease;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        color: white;
    }
    #network-switch-overlay.visible {
        opacity: 1; pointer-events: auto;
    }
    #network-switch-overlay .ns-card {
        display: flex; flex-direction: column; align-items: center; gap: 18px;
        padding: 28px 32px;
        transform: translateY(8px); opacity: 0;
        transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.4s ease;
    }
    #network-switch-overlay.visible .ns-card {
        transform: translateY(0); opacity: 1;
    }
    #network-switch-overlay .ns-card img {
        width: 84px; height: 84px;
        object-fit: contain;
        border-radius: 18px;
        background: rgba(255,255,255,0.06);
        padding: 10px;
        animation: ns-pulse 1.6s ease-in-out infinite;
    }
    #network-switch-overlay .ns-progress {
        width: 200px; height: 3px;
        background: rgba(255,255,255,0.08);
        border-radius: 999px; overflow: hidden;
    }
    #network-switch-overlay .ns-progress span {
        display: block; height: 100%; width: 40%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.85), transparent);
        animation: ns-slide 1.4s ease-in-out infinite;
    }
    #network-switch-overlay .ns-text {
        font-size: 13px;
        opacity: 0.7;
        letter-spacing: 0.04em;
    }
    @keyframes ns-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.95); opacity: 0.85; }
    }
    @keyframes ns-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
    }
</style>
