	<link rel="canonical" href="https://mybusfinder.fr">
	<script>
        // Made with ♥ by BecabDev in Cannes, France ⛱️🎬
		(function () {
			try {
				var p = new URLSearchParams(window.location.search);
				var q = p.get('network');
				if (q && /^[a-z0-9-]+$/i.test(q)) {
					localStorage.setItem('activeNetwork', q);
				}
			} catch (_) {}
			var net = localStorage.getItem('activeNetwork') || 'palmbus';
			window.__BOOT_NETWORK = net;
			document.write(
				'<link rel="apple-touch-icon" href="networks/' + net + '/src/logo.png">' +
				'<link rel="icon" type="image/png" href="networks/' + net + '/src/logo.png">'
			);
		})();
	</script>

<body>

<div id="bottom-sheet" class="bs bs-collapsed">

    <!-- Drag handle -->
    <div class="bs-handle-zone" id="bs-handle-zone" aria-label="Glisser pour étendre">
        <div class="bs-handle-bar"></div>
    </div>

    <!-- Expanded content (shown only when expanded) -->
    <div class="bs-content" id="bs-content">
        <div class="bs-greeting">
            <h2 class="bs-greeting-title" data-i18n="welcome">Bienvenue</h2>
            <p class="bs-greeting-subtitle" id="bs-network-name">My Bus Finder</p>
        </div>

        <div class="bs-features">
            <button class="bs-feat ripple-container" id="bus" type="button">
                <div class="bs-feat-icon">🚌</div>
                <div class="bs-feat-title" data-i18n="search_bus">Localiser un bus</div>
            </button>
            <button class="bs-feat ripple-container" id="clock-feat" type="button">
                <div class="bs-feat-icon">⏰</div>
                <div class="bs-feat-title" data-i18n="schedules">Horaires</div>
            </button>
            <button class="bs-feat ripple-container" id="ticket" type="button">
                <div class="bs-feat-icon">🎫</div>
                <div class="bs-feat-title" data-i18n="reloadticket">Recharger</div>
            </button>
            <button class="bs-feat ripple-container" id="actu" type="button">
                <div class="bs-feat-icon">📰</div>
                <div class="bs-feat-title" data-i18n="news">Actualités</div>
            </button>
        </div>

        <div class="bs-quick-links">
            <h3 class="bs-section-title" data-i18n="quick_links">Accès rapide</h3>
            <button class="bs-link ripple-container" id="settings" type="button">
                <span class="bs-link-icon">⚙️</span>
                <span class="bs-link-title" data-i18n="settings">Paramètres</span>
            </button>
            <button class="bs-link ripple-container" id="mbh" type="button">
                <span class="bs-link-icon">🚇</span>
                <span class="bs-link-title">My Bus History</span>
            </button>
            <button class="bs-link ripple-container" id="bs-switch-network" type="button">
                <span class="bs-link-icon">🔀</span>
                <span class="bs-link-title">Changer de réseau</span>
            </button>
            <button class="bs-link ripple-container" id="mybusfinderhome" type="button">
                <span class="bs-link-icon">🏠</span>
                <span class="bs-link-title">mybusfinder.fr</span>
            </button>
        </div>
    </div>

    <!-- Always-visible 4-icon row (the existing menubtm) -->
    <ul id="menubtm" class="menubottom-ul ripple-container">
        <li>
            <a id="btn-network-switch">
                <span class="icon" id="btn-network-switch-icon" style="width:30px; height:30px; display:flex; align-items:center; justify-content:center;">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 7H17M17 7L13 3M17 7L13 11"/>
                        <path d="M20 17H7M7 17L11 13M7 17L11 21"/>
                    </svg>
                </span>
                <span class="title" data-i18n="changeNetwork">Changer</span>
            </a>
        </li>
        <li>
            <a id="clock"><span class="icon"><img src="src/horloge.png" id="myscheduleicon" style="width: 30px; height: 30px;"></img></span> <span
                    class="title" data-i18n="schedule">Horaires</span></a>
        </li>
        <li>
            <a id="menubutton"><span class="icon"><img src="src/bus.png" id="vehicleicon" style="width: 30px; height: 30px;"></img></span> <span
                    class="title" data-i18n="network">Réseau</span></a>
        </li>
        <li>
            <a id="histovecbutton"><span class="icon"><img id="actuicon" src="src/newspaper.png" style="width: 30px; height: 30px;"></img></span> <span

<div id="loading-screen" class="logobkg">
    <img id="logoscr" class="logoscr"
         src="networks/palmbus/src/whitelogo.png"
         onerror="this.onerror=null;this.src='src/whitelogo.png';"
         style="display: block; margin: 0 auto; max-width: 50%; height: auto;"/>
    <script>
        (function () {
            var net = (localStorage.getItem('activeNetwork') || 'palmbus');
            var img = document.getElementById('logoscr');

<div id="network-switch-overlay" aria-hidden="true">
    <div class="ns-card">
        <div class="ns-progress"><span></span></div>
        <div class="ns-text">Changement de réseau…</div>
    </div>

<style>
    #network-switch-overlay {
        position: fixed; inset: 0; z-index: 99999;
        background: rgba(8,10,18,0.92);
        backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
        display: flex; align-items: center; justify-content: center;
        opacity: 0; pointer-events: none;
        transition: opacity 0.32s ease;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        color: white;
    }
    #network-switch-overlay.visible {
        opacity: 1; pointer-events: auto;
    }
    #network-switch-overlay .ns-card {
        display: flex; flex-direction: column; align-items: center; gap: 18px;
        padding: 28px 32px;
        transform: translateY(8px); opacity: 0;
        transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.4s ease;
    }
    #network-switch-overlay.visible .ns-card {
        transform: translateY(0); opacity: 1;
    }
    #network-switch-overlay .ns-card img {
        width: 84px; height: 84px;
        object-fit: contain;
        border-radius: 18px;
        background: rgba(255,255,255,0.06);
        padding: 10px;
        animation: ns-pulse 1.6s ease-in-out infinite;
    }
    #network-switch-overlay .ns-progress {
        width: 200px; height: 3px;
        background: rgba(255,255,255,0.08);
        border-radius: 999px; overflow: hidden;
    }
    #network-switch-overlay .ns-progress span {
        display: block; height: 100%; width: 40%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.85), transparent);
        animation: ns-slide 1.4s ease-in-out infinite;
    }
    #network-switch-overlay .ns-text {
        font-size: 13px;
        opacity: 0.7;
        letter-spacing: 0.04em;
    }
    @keyframes ns-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.95); opacity: 0.85; }
    }
    @keyframes ns-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
    }
</style>
